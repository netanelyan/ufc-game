<title>Pixel Fight Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: the game fills the whole screen. Translucent thumb pads float over the arena,
   and the camera frames the fight in whatever space the pads leave free (see layout() in the script). */
:root{
  --ink:#07080d;
  --steel:#161b28;
  --chalk:#f2f2f2;
  --gold:#f3c623;
  --blood:#d8302a;
  --cage:#2f5fd0;
  --kick:#7a4310;
  --grab:#1d5634;
  --pixel:"Press Start 2P", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--ink)}
body{height:100%;margin:0;background:var(--ink);color:var(--chalk);font-family:var(--pixel);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{--mode:portrait;--b:min(calc((100vw - 24px - 44px) / 4), 74px);position:fixed;inset:0;overflow:hidden}
.stage{position:absolute;inset:0;background:#000;touch-action:none;overflow:hidden}
#screen{position:absolute;inset:0;display:block;width:100%;height:100%;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;image-rendering:pixelated}
.world{position:absolute;left:0;top:0;width:100%;height:100%;--u:3.9px;pointer-events:none}
.world #pauseBtn{pointer-events:auto}

.controls{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;justify-content:space-between;align-items:end;gap:12px;padding:0 max(12px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));pointer-events:none}
.pad{display:grid;grid-template-columns:repeat(2,var(--b));gap:8px;pointer-events:auto}
.k{width:var(--b);height:var(--b);padding:0;font-family:var(--pixel);font-size:calc(var(--b) * .14);color:var(--chalk);background:rgba(22,27,40,.5);border:3px solid rgba(242,242,242,.8);border-radius:0;box-shadow:0 4px 0 rgba(0,0,0,.55);text-shadow:2px 2px 0 #000;touch-action:none;cursor:pointer;display:grid;place-items:center;line-height:1.5;white-space:pre-line}
.k.hit{background:rgba(125,26,23,.6)}
.k.def{background:rgba(22,51,122,.6)}
.k.kick{background:rgba(122,67,16,.62)}
.k.grab{background:rgba(29,86,52,.62)}
.k.wide{grid-column:span 2;width:auto}
.k.off{opacity:.3}
.k.mv{font-size:calc(var(--b) * .3)}
.k.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.55);filter:brightness(1.5)}
.k.sup{background:rgba(214,150,16,.82);border-color:#fff1a8;animation:sup .5s steps(2) infinite}
@keyframes sup{50%{background:rgba(242,110,30,.9);box-shadow:0 0 12px #f3c623}}
.k:focus-visible,.cta:focus-visible,.link:focus-visible,#pauseBtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.legend{position:absolute;left:0;right:0;bottom:0;z-index:2;display:none;flex-wrap:wrap;justify-content:center;gap:6px 22px;padding:10px 16px 12px;font-size:10px;line-height:1.8;background:var(--ink);color:rgba(242,242,242,.75)}
.legend b{color:var(--gold);font-weight:400}

@media (hover:hover) and (pointer:fine){
  #app{--mode:desktop}
  .controls{display:none}
  .legend{display:flex}
}
@media (orientation:landscape) and (pointer:coarse){
  #app{--mode:landscape;--b:min(64px, calc((100vh - 44px) / 3.4));--b:min(64px, calc((100dvh - 44px) / 3.4))}
  .controls{top:0;align-items:center;padding:0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px))}
}

/* overlays inside the screen, sized to the screen */
#pauseBtn{position:absolute;top:1.4%;left:50%;transform:translateX(-50%);width:calc(6.5*var(--u));height:calc(6.5*var(--u));padding:0;font-family:var(--pixel);font-size:calc(2.2*var(--u));background:#000;color:var(--chalk);border:calc(.45*var(--u)) solid var(--chalk);cursor:pointer}
#big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#big span{font-size:calc(9*var(--u));color:var(--gold);text-shadow:calc(.7*var(--u)) calc(.7*var(--u)) 0 var(--blood),calc(1.2*var(--u)) calc(1.2*var(--u)) 0 #000;animation:pop .35s steps(4) both;margin-top:-calc(10*var(--u))}
#big span.count{font-size:calc(14*var(--u));color:var(--chalk)}
@keyframes pop{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}
.box{position:absolute;left:50%;transform:translateX(-50%);box-sizing:border-box;background:#000;color:#fff;border:calc(.6*var(--u)) solid #fff;outline:calc(.45*var(--u)) solid #000;box-shadow:inset 0 0 0 calc(.5*var(--u)) #000,inset 0 0 0 calc(.8*var(--u)) #fff;padding:calc(2.6*var(--u)) calc(3.6*var(--u));font-size:calc(2.9*var(--u));line-height:1.75;text-align:center;text-wrap:balance}
#msg{top:46%;transform:translate(-50%,-50%);width:84%}
#prompt{bottom:2.5%;width:70%;padding:calc(1.6*var(--u)) calc(2*var(--u));font-size:calc(2.7*var(--u));animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
#bug{position:absolute;left:50%;bottom:2.5%;transform:translateX(-50%);display:flex;align-items:stretch;background:#0b0c12;border:calc(.35*var(--u)) solid #000;font-size:calc(2.1*var(--u));white-space:nowrap;line-height:1}
#bug>span{padding:calc(1.1*var(--u)) calc(1.3*var(--u));display:flex;align-items:center}
#bug .rk{background:var(--gold);color:#000;margin:calc(.6*var(--u));padding:calc(.5*var(--u)) calc(.7*var(--u))}
#bug .mid{gap:calc(1.4*var(--u));border-inline:calc(.35*var(--u)) solid #2c3348;font-variant-numeric:tabular-nums}
#bug .brand{color:var(--blood);font-style:italic}
#bug .rd{border:calc(.3*var(--u)) solid var(--gold);color:var(--gold);padding:calc(.4*var(--u)) calc(.5*var(--u))}
.stage.ended #bug{bottom:16%}
#mash{position:absolute;left:50%;top:21%;transform:translateX(-50%);width:54%;display:flex;flex-direction:column;align-items:center;gap:calc(1.6*var(--u));font-size:calc(2.8*var(--u));text-shadow:calc(.4*var(--u)) calc(.4*var(--u)) 0 #000}
#mash .bar{width:100%;height:calc(2.6*var(--u));border:calc(.45*var(--u)) solid #fff;background:#000;outline:calc(.35*var(--u)) solid #000}
#mashFill{height:100%;width:0;background:var(--gold)}

/* full-screen menus */
#panel{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding-inline:16px;padding-block:calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 16px);background:rgba(5,6,12,.93);overflow-y:auto;box-sizing:border-box}
.card{width:min(100%,470px);display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center;margin:auto}
.logo{margin:0;font-size:clamp(24px,8vw,42px);font-weight:400;line-height:1.15;color:var(--gold);text-shadow:3px 3px 0 var(--blood),6px 6px 0 #000;text-wrap:balance}
.logo small{display:block;font-size:.42em;color:var(--chalk);text-shadow:2px 2px 0 #000;letter-spacing:.3em;margin-bottom:.7em}
.logo.mini{font-size:clamp(20px,6vw,30px)}
.sub{margin:0;font-size:10px;line-height:1.9;opacity:.8}
.eyebrow{font-size:10px;letter-spacing:.15em;color:var(--blood);text-transform:uppercase}
.tape{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;width:100%}
.tape .side{display:flex;flex-direction:column;gap:8px;align-items:center;min-width:0}
.tape .tn{font-size:13px;overflow-wrap:anywhere}
.rk{display:inline-block;background:var(--gold);color:#000;padding:4px 6px;font-size:10px}
.vs{color:var(--blood);font-size:15px}
.vs.big{font-size:30px;text-shadow:3px 3px 0 #000}
/* arcade select: you on the left in red, the cpu on the right in blue, every fighter in one grid */
.card.mk{width:min(100%,520px);gap:12px}
.mkTop{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:8px;width:100%}
.mkSide{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;padding:8px 4px 10px;border:3px solid;background:#0b0d16;box-sizing:border-box}
.mkSide.p1{border-color:var(--blood)}
.mkSide.p2{border-color:var(--cage)}
.mkSide .pbig{width:64px;height:106px}
.mkSide .tn{font-size:11px;line-height:1.4;overflow-wrap:anywhere}
.mkWho{font-size:8px;letter-spacing:.25em;text-transform:uppercase}
.mkSide.p1 .mkWho{color:#ff7468}
.mkSide.p2 .mkWho{color:#86a8ff}
.mkSide.empty{justify-content:center}
.mkQ{font-size:44px;color:#2c3348;margin:auto}
.mkMid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.mkMid .eyebrow{max-width:10ch;line-height:1.7}
.mkGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%}
.mkTile{position:relative;aspect-ratio:1;padding:0;background:#0b0d16;border:2px solid #232a3d;cursor:pointer;display:grid;place-items:center;color:var(--chalk);font-family:var(--pixel);font-size:18px;overflow:hidden}
.mkTile canvas{width:100%;height:100%;display:block}
.mkDiv{position:absolute;right:2px;bottom:2px;font-size:6px;opacity:.55}
.mkTile.p1{border-color:rgba(216,48,42,.7)}
.mkTile.on.p{border-color:#ff7468;box-shadow:inset 0 0 0 2px var(--blood);background:#2a0f10;animation:mkp .6s steps(2) infinite}
.mkTile.on.o{border-color:#86a8ff;box-shadow:inset 0 0 0 2px var(--cage);background:#0f1a36;animation:mkp .6s steps(2) infinite}
.mkTile.rand{color:var(--gold)}
@keyframes mkp{50%{filter:brightness(1.5)}}
.vsCard{gap:16px}
.vsCard .pbig{width:88px;height:145px}
@media (orientation:landscape) and (max-height:520px){
  .card.mk{width:min(100%,880px);display:grid;grid-template-columns:150px 1fr 150px;grid-template-areas:"p1 mid p2" "p1 grid p2" "p1 ok p2" "row row row" "rules rules rules";gap:8px 14px;align-items:center;justify-items:center}
  .mk .logo,.mkMid .vs{display:none}
  .mkTop{display:contents}
  .mkSide.p1{grid-area:p1;align-self:stretch}
  .mkSide.p2{grid-area:p2;align-self:stretch}
  .mkMid{grid-area:mid}
  .mkMid .eyebrow{max-width:none}
  .mkGrid{grid-area:grid;grid-template-columns:repeat(10,1fr)}
  .mk #pickOk{grid-area:ok;padding:10px 24px}
  .mk .row{grid-area:row}
  .mk .rules{grid-area:rules}
  .vsCard{width:min(100%,640px);gap:6px}
  .vsCard .pbig{width:52px;height:86px}
  .vsCard .tape .side{gap:4px}
  .vsCard .tale td,.vsCard .tale th{padding:2px}
  .vsCard .cta{padding:8px 24px}
}
@media (prefers-reduced-motion:reduce){.mkTile.on{animation:none}}
.field{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:9px;letter-spacing:.1em;opacity:.95}
.field input{font-family:var(--pixel);font-size:16px;background:#000;color:var(--chalk);border:3px solid var(--chalk);border-radius:0;padding:10px;text-align:center;width:13ch;text-transform:uppercase;-webkit-user-select:text;user-select:text}
.cta{font-family:var(--pixel);font-size:16px;color:#fff;background:var(--blood);border:3px solid #fff;border-radius:0;padding:14px 28px;box-shadow:0 6px 0 #000;cursor:pointer;text-transform:uppercase}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #000}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px}
.link{background:none;border:0;color:var(--chalk);opacity:.75;font-family:var(--pixel);font-size:9px;text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:8px 4px}
.rules{margin:0;padding:0;list-style:none;font-size:9px;line-height:2;text-align:left;max-width:46ch;display:flex;flex-direction:column;gap:10px}
.rules b{color:var(--gold);font-weight:400}
.stats{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}
.stats th{font-weight:400;color:var(--gold);padding:8px 4px;font-size:10px}
.stats td{padding:9px 4px;border-top:2px solid #232a3d}
.stats td:first-child{text-align:left;opacity:.7;font-size:9px}
.tabs{display:flex;border:3px solid var(--chalk);box-shadow:0 4px 0 #000}
.tab{font-family:var(--pixel);font-size:10px;padding:10px 14px;background:#000;color:var(--chalk);border:0;cursor:pointer;opacity:.7}
.tab.on{background:var(--chalk);color:#000;opacity:1}
.tab:focus-visible,.chip:focus-visible,.fc:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
canvas[data-f]{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.pbig{width:80px;height:132px}
.tape .pbig{width:72px;height:119px}
.nick{font-size:8px;color:var(--gold);line-height:1.6;overflow-wrap:anywhere}
.tale{width:100%;border-collapse:collapse;font-size:9px;line-height:1.5}
.tale td{width:42%;padding:5px 2px;border-top:2px solid #232a3d;text-transform:lowercase}
.tale td:first-child{text-align:right}
.tale td:last-child{text-align:left}
.tale th{font-weight:400;color:var(--gold);font-size:8px;padding:5px 8px;border-top:2px solid #232a3d;white-space:nowrap}
.card.sel{gap:14px}
.divs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chip{font-family:var(--pixel);font-size:9px;padding:8px 7px;min-width:40px;background:#000;color:var(--chalk);border:2px solid #4a5370;cursor:pointer}
.chip.on{border-color:var(--gold);color:var(--gold)}
.detail{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:#0b0d16;border:2px solid #232a3d;padding:10px;box-sizing:border-box}
.detail .pbig{flex:none}
.info{display:flex;flex-direction:column;gap:7px;min-width:0;flex:1}
.dn{font-size:11px;line-height:1.5;overflow-wrap:anywhere}
.meta{font-size:8px;line-height:1.7;opacity:.8}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.stat{display:flex;flex-direction:column;gap:3px;font-size:7px;opacity:.95}
.stat i{display:block;height:5px;background:linear-gradient(90deg,var(--gold) var(--v),#232a3d var(--v))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;width:100%}
.fc{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px 9px;background:#0b0d16;border:2px solid #232a3d;color:var(--chalk);font-family:var(--pixel);cursor:pointer}
.fc canvas{width:78px;height:72px}
.fc .rk{position:absolute;top:4px;left:4px;font-size:7px;padding:3px 4px}
.fc .fn{font-size:7px;line-height:1.4;overflow-wrap:anywhere}
.fc.on{border-color:var(--gold);background:#1a1c10}
.card .box{position:static;transform:none;width:100%;font-size:10px;padding:16px 18px;border-width:3px;outline-width:2px;box-shadow:inset 0 0 0 3px #000,inset 0 0 0 5px #fff}
@media (prefers-reduced-motion:reduce){#big span,#prompt{animation:none}}
</style>

<div id="app">
  <div class="stage" id="stage">
    <canvas id="screen" width="192" height="144" aria-label="Fight arena"></canvas>
    <div class="world" id="world">
    <button id="pauseBtn" aria-label="Pause">II</button>
    <div id="big" hidden></div>
    <div id="mash" hidden><div id="mashLabel">tap fast</div><div class="bar"><div id="mashFill"></div></div></div>
    <div id="msg" class="box" hidden></div>
    <div id="bug">
      <span class="rk" id="bugPR">#6</span><span id="bugPN">KANE</span>
      <span class="mid"><b class="brand">PFC</b><span id="bugClock">1:00</span><span class="rd" id="bugRd">R1</span></span>
      <span class="rk" id="bugOR">#5</span><span id="bugON">RIOS</span>
    </div>
    <div id="prompt" class="box" hidden></div>
    </div>
  </div>

  <div class="controls">
    <div class="pad left">
      <button class="k grab" data-k="shoot">SHOOT</button>
      <button class="k def" data-k="slip">SLIP</button>
      <button class="k def wide" data-k="block" data-hold="1">BLOCK</button>
      <button class="k mv" data-k="left" data-hold="1" aria-label="Move left">&#9664;</button>
      <button class="k mv" data-k="right" data-hold="1" aria-label="Move right">&#9654;</button>
    </div>
    <div class="pad right">
      <button class="k kick" data-k="head">HEAD
KICK</button>
      <button class="k kick" data-k="leg">LEG
KICK</button>
      <button class="k hit" data-k="hook">HOOK</button>
      <button class="k hit" data-k="upper">UPPER</button>
      <button class="k hit" data-k="jab">JAB</button>
      <button class="k hit" data-k="cross">CROSS</button>
    </div>
  </div>

  <div class="legend">
    <span><b>A D</b> move</span><span><b>S</b> block (hold)</span><span><b>W</b> slip</span>
    <span><b>J</b> jab</span><span><b>K</b> cross</span><span><b>L</b> hook</span><span><b>I</b> uppercut</span>
    <span><b>U</b> leg kick</span><span><b>O</b> head kick / super</span><span><b>E</b> takedown</span>
    <span><b>SPACE</b> continue</span><span><b>P</b> pause</span>
  </div>
</div>

<div id="panel" hidden></div>

<script>
(() => {
'use strict';
const W = 192, H = 144, FLOOR = 122, LEFT = 18, RIGHT = 174, ROUND_T = 60, MIN_GAP = 16;
const $ = id => document.getElementById(id);
const cv = $('screen'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const stageEl = $('stage'), panel = $('panel'), bigEl = $('big'), msgEl = $('msg'), promptEl = $('prompt'), mashEl = $('mash'), mashFill = $('mashFill'), mashLabel = $('mashLabel');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isTouch = matchMedia('(pointer: coarse)').matches;
const rnd = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[rnd() * a.length | 0];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(w, h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function shadeHex(hex, f){const n=parseInt(hex.slice(1),16);const r=clamp(Math.round((n>>16&255)*f),0,255),g=clamp(Math.round((n>>8&255)*f),0,255),b=clamp(Math.round((n&255)*f),0,255);return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}

/* ---------- 3x5 pixel font for signage painted in the arena ---------- */
const FONT = {A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110','.':'000000000000010','+':'000010111010000','#':'101111101111101','-':'000000111000000','!':'010010010000010',':':'000010000010000',' ':'000000000000000'};
function txt(g, s, x, y, col, sx = 1, sy = 1, vert = false){
  g.fillStyle = col; s = String(s).toUpperCase();
  for (let i = 0; i < s.length; i++){
    const gl = FONT[s[i]]; if (!gl) continue;
    for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++) if (gl.charCodeAt(r*3+c) === 49){
      if (vert) g.fillRect(x + (4-r)*sx, y + (i*4+c)*sy, sx, sy);
      else g.fillRect(x + (i*4+c)*sx, y + r*sy, sx, sy);
    }
  }
}
const tw = (s, sx = 1) => s.length*4*sx - sx;
function txtOut(g, s, x, y, col){
  for (const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1],[1,1]]) txt(g, s, x+dx, y+dy, '#000');
  txt(g, s, x, y, col);
}

/* ---------- arena art, generated once ---------- */
// The canvas is a camera over an arena that keeps going past the 192x144 fight area:
// VW x VH canvas pixels, world point (x, y) lands at (x - CAMX, y - CAMY). VIEW is the part not under the pads.

function stepFighter(f, dt, other, ctrl){

    def.hp -= dmg; def.dmgTaken += dmg; att.stats.dmg[r] += dmg*.5; def.stats.blocked[r]++;

    if (def.hp <= 0){ def.hp = 0; knockdown(def, att, att.atk, false); }
    return;
  }
  const prev = def.state;
  if (counter){ dmg *= 1.4; popup('COUNTER!', att.x + att.dir*14, FLOOR - 70, '#f3c623'); }
  // combos: each shot that lands soon after the last one hits a little harder
  att.combo = att.comboT > 0 ? att.combo + 1 : 1; att.comboT = 1; att.landed = true;
  def.combo = 0; def.comboT = 0;
  dmg *= 1 + .06*Math.min(4, att.combo - 1);
  def.hp -= dmg; def.dmgTaken += dmg;
  att.stats.landed[r]++; att.stats.dmg[r] += dmg; att.counterT = 0;
  gainSp(att, A.sup ? 0 : dmg*1.6); gainSp(def, dmg*1.1);

  def.atk = null; def.queued = null; def.gasNext = def.st <= 0;

  G.hitstop = A.sup ? .16 : dmg > 10 ? .09 : .035; G.shake = A.sup ? .5 : dmg > 10 ? .25 : .08; G.hype += dmg/20;

}

// Dropped once: the other fighter pounces and it goes to the ground.
// Dropped twice, by a head kick, or by a big counter: lights out.
function knockdown(v, a, how, counter){
  v.downs++; v.lastHow = how; a.stats.kd[ri()]++;
  v.state = 'down'; v.t = 0; v.atk = null; v.queued = null; v.gasNext = false;
  const ko = v.downs >= 2 || how === 'super' || (counter && v.downs >= 1 && rnd() < .5);
  G.ev = {v, a, ko}; G.t = 0; IN.q.length = 0;
  G.slow = .9; G.flash = .5; G.shake = .4; G.hitstop = .12; G.hype = 1.2;
  SFX.down(); SFX.swell(.5);
  if (ko){ v.vx = a.dir*34; G.mode = 'koSeq'; showBig('KO!', 1.6); }
  else { v.vx = a.dir*20; v.hp = v.hpShown = Math.round(v.hpMax*.4); G.mode = 'pounce'; showBig('DOWN!', .9); }
}

/* ---------- ground game ---------- */
function placeGround(){
  const g = G.gr;
  g.bot.x = clamp(g.bot.x, LEFT + 14, RIGHT - 14);
  g.top.dir = -g.bot.dir;
  g.top.x = g.bot.x - 11*g.bot.dir;
}
function takedown(top, bot, fromKD){
  for (const f of [top, bot]){ f.t = 0; f.atk = null; f.queued = null; f.gasNext = false; f.cover = false; f.gAnim = null; f.vx = 0; f.counterT = 0; }
  top.state = 'gtop'; bot.state = 'gbot'; top.gcd = .4; bot.gcd = 0;
  bot.dir = top.x >= bot.x ? 1 : -1;
  G.gr = {top, bot, t:0, esc:0, sub:null, idle:0};
  placeGround();
  if (!fromKD){
    top.stats.td[ri()]++;
    bot.hp = Math.max(1, bot.hp - 4); bot.dmgTaken += 4;
    popup('TAKEDOWN!', bot.x, FLOOR - 44, '#9fd3ff');
    SFX.down(); SFX.swell(.25); G.shake = .25;
  }
  dust(bot.x);
  G.mode = 'ground'; IN.q.length = 0;
  if (o.ai){ o.ai.gcool = .5; o.ai.coverT = 0; }
}
function leaveGround(){
  const g = G.gr; if (!g) return;
  const {top, bot} = g;
  bot.state = 'up'; bot.t = 0; bot.cover = false;
  top.state = 'idle'; top.t = 0; top.gAnim = null;
  top.x = clamp(bot.x - 28*bot.dir, LEFT, RIGHT);
  if (Math.abs(top.x - bot.x) < 22) top.x = clamp(bot.x + 28*bot.dir, LEFT, RIGHT);
  dust(bot.x); G.gr = null; hideMash();
}
function standUp(reason){
  leaveGround();
  if (reason === 'escape') popup('BACK UP!', (p.x + o.x)/2, FLOOR - 66, '#9fd3ff');
  if (reason === 'ref') showBig('STAND UP!', .8);
  G.mode = 'fight'; IN.q.length = 0;
}
function gStrike(f, kind){
  const g = G.gr; if (f.gcd > 0 || f.st < 3 || g.sub) return;
  const bot = g.bot, A = kind === 'pound' ? {d:3, c:5, cd:.5} : {d:6, c:9, cd:.8}, r = ri();
  f.gcd = A.cd; f.st -= A.c; f.gAnim = {kind, t:0}; f.stats.thrown[r]++;
  let dmg = A.d * f.power * (f.st < 20 ? .65 : 1) * (f.isP ? 1.05 : .9);
  if (bot.cover){ dmg *= .3; SFX.block(); bot.stats.blocked[r]++; }
  else { SFX.punch(dmg + 4); f.stats.landed[r]++; gainSp(f, dmg*1.5); }
  bot.hp -= dmg; bot.dmgTaken += dmg; f.stats.dmg[r] += dmg;
  g.esc = Math.max(0, g.esc - .03); g.idle = 0;
  const hx = bot.x - 20*bot.dir, hy = FLOOR - 6;
  spark(hx, hy, kind === 'elbow' && !bot.cover, bot.cover);
  if (!bot.cover && kind === 'elbow') blood(hx, hy, f.dir);
  G.shake = .08; G.hype += dmg/25;
  if (bot.hp <= 0){ bot.hp = 0; bot.lastHow = 'gnp'; G.flash = .4; SFX.swell(.5); endFight(f, 'TKO', {ground:true}); }
}
function upPunch(f){
  const g = G.gr; if (f.gcd > 0 || f.st < 3) return;
  f.gcd = .4; f.st -= 3; g.top.hp = Math.max(1, g.top.hp - 1.5); g.esc += .02; f.wig = .12; SFX.punch(1);
}
function escPress(f){
  const g = G.gr;
  const need = f.isP ? 6 + 5*g.top.ctrl : 12 + 10*g.top.ctrl;
  g.esc += (f.st < 15 ? .5 : 1)/need; f.st = Math.max(0, f.st - 1.2); f.wig = .15;

}
function trySweep(f){
  const g = G.gr; if (f.sweepCd > 0 || f.st < 15) return;
  f.st -= 15; f.sweepCd = 2.2; f.wig = .3;
  const chance = .16 + .35*(1 - g.top.st/100) + .2*f.grapple - .1*g.top.ctrl + (f.isP ? .2 : 0);
  if (rnd() < chance){
    const top = g.top; g.top = f; g.bot = top; f.state = 'gtop'; top.state = 'gbot'; top.cover = false; f.gAnim = null; f.gcd = .4;
    g.esc = 0; g.idle = 0; placeGround(); dust(g.bot.x);
    popup('SWEEP!', g.bot.x, FLOOR - 44, '#f3c623'); SFX.down(); SFX.swell(.3);
  } else popup('NO SWEEP', g.bot.x, FLOOR - 40, '#cfd6e6');
}
function trySub(f){
  const g = G.gr; if (f.st < 15 || g.sub) return;
  f.st -= 15; g.sub = {by:f, m:(f.isP ? .28 : .2) + .12*f.grapple, t:0, name:pick(f.subs)}; g.idle = 0;
  popup(g.sub.name, g.bot.x, FLOOR - 44, '#f3c623'); SFX.swell(.3);
}
function subPress(f){
  const s = G.gr.sub; if (!s) return;
  s.m += f === s.by ? (f.isP ? .045 : .04) : (f.isP ? -.065 : -.045); f.st = Math.max(0, f.st - .6); SFX.tick();
}
function updGround(dt){
  const g = G.gr; g.t += dt; g.idle += dt;
  for (const f of [g.top, g.bot]){
    f.t += dt; if (f.gcd > 0) f.gcd -= dt; if (f.sweepCd > 0) f.sweepCd -= dt; if (f.gAnim) f.gAnim.t += dt; if (f.wig > 0) f.wig -= dt;
    const rate = f === g.top ? 9 : f.cover ? 3 : 6;
    if (!g.sub) f.st = Math.min(f.stMax, f.st + rate*dt*f.cardio);
    f.hpShown = f.hpShown > f.hp ? Math.max(f.hp, f.hpShown - 28*dt) : f.hp;
  }
  playerGround();
  if (G.mode !== 'ground') return;
  aiGround(o, dt);
  if (G.mode !== 'ground') return;
  if (g.sub){
    const s = g.sub, d = g.bot; s.t += dt;
    s.m += dt*(.08*(1 - d.hp/d.hpMax) + .06*(1 - d.st/100) - .035 + .09*(s.by.grapple - d.grapple) + (s.by.isP ? .02 : -.04));
    d.st = Math.max(0, d.st - 5*dt);
    if (s.m >= 1){ G.flash = .4; SFX.swell(.6); endFight(s.by, 'SUB', {name:s.name}); return; }
    if (s.m <= 0 || s.t > 7){

      popup('ESCAPED', d.x, FLOOR - 44, '#9fd3ff');

    }

  // arcade rules: the ref stands it up quickly
  if (!g.sub && (g.idle > 3.5 || g.t > 8)){ standUp('ref'); return; }
  if (g.sub){
    mashLabel.textContent = g.sub.by === p ? 'squeeze! tap fast' : 'defend! tap fast';
    showMash(g.sub.m, g.sub.by === p ? '#f3c623' : '#e2382b');
  } else if (g.bot === p){ mashLabel.textContent = 'tap escape to get up'; showMash(g.esc, '#9fd3ff'); }
  else hideMash();
  const before = G.time; G.time -= dt/spd();
  if (before > 10 && G.time <= 10) SFX.clap();
  if (G.time <= 0){ G.time = 0; endRound(); }
}
function playerGround(){
  const g = G.gr; let a;
  while (G.mode === 'ground' && (a = IN.q.shift())){
    if (g.sub){ subPress(p); continue; }
    if (g.top === p){
      if (a === 'jab' || a === 'cross') gStrike(p, 'pound');
      else if (a === 'hook' || a === 'upper') gStrike(p, 'elbow');
      else if (a === 'leg' || a === 'head') trySub(p);
      else if (a === 'shoot') standUp('top');
    } else {
      if (a === 'shoot' || a === 'slip') escPress(p);
      else if (a === 'leg' || a === 'head') trySweep(p);
      else if (a === 'jab' || a === 'cross') upPunch(p);
    }
  }
  if (G.mode === 'ground') p.cover = G.gr.bot === p && IN.block && !G.gr.sub;
}
function aiGround(o, dt){
  const g = G.gr, b = o.ai; b.gcool -= dt;
  if (g.sub){ if (rnd() < (4 + 5*b.grapple)*dt/spd()) subPress(o); return; }
  if (g.top === o){
    if (b.gcool > 0) return;
    const bot = g.bot;
    if (o.st < 12 && rnd() < .4){ standUp('top'); return; }
    if ((bot.hp/bot.hpMax < .55 || bot.st < 25) && o.st > 30 && rnd() < .1 + .25*b.grapple) trySub(o);
    else gStrike(o, rnd() < .35 ? 'elbow' : 'pound');
    b.gcool = .45 + rnd()*.5*(1.5 - b.aggr);
  } else {
    if (b.coverT > 0) b.coverT -= dt;
    else if (rnd() < b.blockP*dt*1.5) b.coverT = .7;
    o.cover = b.coverT > 0;
    if (!o.cover && rnd() < (2.5 + 4*b.grapple)*dt/spd()) escPress(o);
    if (G.mode === 'ground' && rnd() < .3*b.grapple*dt) trySweep(o);
  }
}

/* ---------- opponent brain (standing) ---------- */
function brain(o, p, dt){
  const b = o.ai, c = {move:0, block:false, punch:null, slip:false};
  const d = Math.abs(p.x - o.x) - o.reachPx, tw = Math.sign(p.x - o.x) || 1;
  // keep it close: sharper when you're running away with it, looser when you're in trouble
  const lead = clamp(p.hp/p.hpMax - o.hp/o.hpMax, -.5, .5);
  if (p.state === 'atk' && p.atkId !== b.seen){
    b.seen = p.atkId;
    const freeish = o.state === 'idle' || o.state === 'walk' || o.state === 'block';
    if (d + o.reachPx <= p.atkDef.reach + p.reachPx + 10 && freeish){
      const r = rnd()/(1 + lead); let kind = null;
      if (p.atk === 'shoot'){ if (r < b.sprawlP) kind = 'block'; }
      else if (p.atk === 'upper' || p.atk === 'leg' || p.atk === 'super'){ if (r < b.blockP) kind = 'block'; }
      else if (r < b.slipP) kind = 'slip';
      else if (r < b.slipP + b.blockP) kind = 'block';
      if (kind) b.pend = {kind, at:b.reactT*(.5 + rnd()*.7)*(1 - .4*lead)};
    }
  }
  if (b.pend){ b.pend.at -= dt; if (b.pend.at <= 0){ if (b.pend.kind === 'block') b.blockT = .35 + rnd()*.4; else c.slip = true; b.pend = null; } }
  if (b.blockT > 0){ b.blockT -= dt; c.block = true; }
  b.cool -= dt;

  if (b.mode === 'rest'){
    b.modeT -= dt; c.move = -tw; c.block = c.block || d < 32;
    if (b.modeT <= 0 || o.st > 60) b.mode = 'n';
    return c;
  }
  if (b.reserve > 0 && o.st < 18 + b.reserve*.6){ b.mode = 'rest'; b.modeT = 1 + rnd(); return c; }

  const afford = a => b.reserve === 0 || o.st - ATK[a].cost > b.reserve;
  const free = o.state === 'idle' || o.state === 'walk' || o.state === 'block';
  if (o.counterT > 0 && d <= 30) c.punch = d <= 24 ? (rnd() < .5 ? 'hook' : 'cross') : 'cross';
  else if (p.state === 'atk' && p.t > p.atkDef.s*p.tm + p.atkDef.a && d <= 30 && rnd() < b.aggr*dt*8) c.punch = d <= 24 && rnd() < .4 ? 'hook' : 'cross';
  else if (p.state === 'atk' && p.atkDef.kick && !p.atkDef.sup && p.t < p.atkDef.s*p.tm && d <= 30 && rnd() < b.tdP*dt*25) c.punch = 'shoot';
  else if (o.sp >= 100 && d <= 38 && d >= 18 && rnd() < dt*1.2) c.punch = 'super';
  else if (p.state === 'gassed' && d <= 31 && b.cool <= 0){ c.punch = d <= 21 ? pick(['hook','upper','cross']) : rnd() < b.tdP*2 ? 'shoot' : pick(['jab','cross']); b.cool = .3; }
  else if (b.next && free){ c.punch = b.next; b.next = null; }
  if (c.punch){ if (!afford(c.punch)) c.punch = null; else c.block = false; }

  if (!c.punch && !c.block && b.cool <= 0){
    if (d > 36){
      b.cool = .15; b.moveT = .3 + rnd()*.5;
      b.moveDir = rnd() < b.aggr + .3 ? tw : (rnd() < .5 ? 0 : -tw);
    } else if (d >= 20 && d <= 32 && rnd() < b.tdP && afford('shoot')){
      c.punch = 'shoot'; b.cool = .8;
    } else if (d > 24 && rnd() < b.kickP*1.5){
      const k = rnd() < .18 ? 'head' : 'leg';
      if (afford(k)) c.punch = k;
      b.cool = (.35 + rnd()*.5) * (1.65 - b.aggr) * (1 - .3*lead);
    } else if (d > 31){
      b.cool = .15; b.moveT = .2 + rnd()*.3; b.moveDir = rnd() < b.aggr + .3 ? tw : 0;
    } else {
      let opts = d <= 21 ? ['jab','cross','hook','upper','hook'] : d <= 24 ? ['jab','cross','hook','jab'] : ['jab','jab','cross'];
      if (p.state === 'block' && d <= 21 && rnd() < .5) opts = ['upper'];
      if (rnd() < b.aggr){
        const ch = pick(opts);
        if (afford(ch)){ c.punch = ch; if (rnd() < b.comboP) b.next = ch === 'jab' ? 'cross' : ch === 'cross' ? (rnd() < b.kickP*2 ? 'leg' : 'hook') : 'jab'; }
      } else { b.moveT = .25 + rnd()*.3; b.moveDir = rnd() < .5 ? -tw : 0; }
      b.cool = (.25 + rnd()*.55) * (1.65 - b.aggr) * (1 - .3*lead);
    }
  }
  if (d < 17 && b.moveT <= 0 && rnd() < .5){ b.moveDir = -tw; b.moveT = .2; }
  if (b.moveT > 0){ b.moveT -= dt; c.move = b.moveDir; }
  return c;
}

function playerCtrl(){
  let one = IN.q.shift() || null;
  if (one === 'head' && p.sp >= 100) one = 'super';
  return {move:(IN.right?1:0) - (IN.left?1:0), block:IN.block, punch:ATTACKS.includes(one) ? one : null, slip:one === 'slip'};
}

/* ---------- flow ---------- */
function curBout(){
  const pF = FID[career.qp] || FID.yan, oF = FID[career.qo] || FID.merab;
  return {pF, oF, lvl:aiLevel(oF), kind:'quick', rounds:career.qr, rank:pF.rk};
}
function setupFighters(){
  const B = G.bout = curBout();
  const pc = cfgFor(B.pF), oc = cfgFor(B.oF, B.lvl);
  pc.rank = B.rank;
  // different weight classes fight on even terms, so a bantamweight can hang with a heavyweight; reach and height still count
  if (B.pF.div !== B.oF.div){
    const dp = DIV[B.pF.div], dq = DIV[B.oF.div], mid = k => (dp[k] + dq[k])/2;
    for (const [c, dv] of [[pc, dp], [oc, dq]]){
      const f = k => mid(k)/dv[k];
      c.hp = Math.round(c.hp*f('hp')); c.power *= f('pow'); c.spd *= f('spd');
    }
  }
  // mirror match: the opponent switches to blue-corner shorts
  if (B.pF === B.oF) oc.look = {...oc.look, shorts:'#2f5fd0', trim:'#f2f2f2'};
  p = newFighter(true, pc); o = newFighter(false, oc);
  p.belt = B.pF.rk === 'C'; o.belt = B.oF.rk === 'C';
  $('bugPR').textContent = p.rank; $('bugPN').textContent = p.name;
  $('bugOR').textContent = o.rank; $('bugON').textContent = o.name;
  G.rounds = B.rounds;
}
function startFight(){
  setupFighters();
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
  startRound(1, true);
}
function startRound(n, fresh){
  G.round = n; G.time = ROUND_T; G.gr = null; G.ev = null;
  for (const f of [p, o]){
    if (!fresh){ f.hp = Math.min(f.hpMax, f.hp + f.hpMax*.12); f.legDmg = Math.max(0, f.legDmg - 1); }
    f.hpShown = f.hp; f.stMax = 100 - (G.rounds === 5 ? 5 : 8)*(n-1); f.st = f.stMax;
    f.state = 'idle'; f.t = 0; f.x = f.isP ? 40 : 152; f.counterT = 0; f.vx = 0; f.gassedRound = false; f.queued = null; f.atk = null; f.gasNext = false; f.cover = false; f.gAnim = null;
    if (f.ai){ f.ai.cool = .9; f.ai.pend = null; f.ai.blockT = 0; f.ai.next = null; f.ai.mode = 'n'; f.ai.seen = 0; }
  }
  IN.q.length = 0;
  G.mode = 'intro'; G.t = 0; G.said = false;
  hidePanel(); hideResult(); hideMash();
  showBig(n === G.rounds && n > 1 ? 'FINAL ROUND' : 'ROUND ' + n, 1.1);
}
function endRound(){
  leaveGround();
  G.mode = 'roundEnd'; G.t = 0; IN.q.length = 0;
  for (const f of [p, o]) if (['atk','block','slip','hit'].includes(f.state)){ f.state = 'idle'; f.t = 0; f.atk = null; }
  SFX.bell(3); SFX.swell(.25); showBig('TIME!', 1.6);
}
function decision(){
  const cards = [];
  for (let j = 0; j < 3; j++){
    let ps = 0, os = 0;
    for (let r = 0; r < G.round; r++){
      const pk = o.stats.kd[r], ok = p.stats.kd[r];
      const pp = p.stats.dmg[r] + p.stats.landed[r]*1.2 + p.stats.td[r]*8 + (rnd()-.5)*10 + ok*30;
      const oo = o.stats.dmg[r] + o.stats.landed[r]*1.2 + o.stats.td[r]*8 + (rnd()-.5)*10 + pk*30;
      if (Math.abs(pp - oo) < 1.5){ ps += 10; os += 10; }
      else if (pp > oo){ ps += 10; os += Math.max(7, 9 - ok); }
      else { os += 10; ps += Math.max(7, 9 - pk); }
    }
    cards.push([ps, os]);
  }
  const pW = cards.filter(c => c[0] > c[1]).length, oW = cards.filter(c => c[1] > c[0]).length;
  const str = cards.map(c => c[0] + '-' + c[1]).join(', ');
  let w = null, type = 'draw';
  if (pW >= 2){ w = p; type = pW === 3 ? 'unanimous' : oW === 1 ? 'split' : 'majority'; }
  else if (oW >= 2){ w = o; type = oW === 3 ? 'unanimous' : pW === 1 ? 'split' : 'majority'; }
  endFight(w, 'DEC', {type, str});
}
function clockStr(t){ const s = Math.max(0, Math.ceil(t)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function endFight(w, method, x = {}){
  const g = G.gr;
  if (g){ const loser = w === g.top ? g.bot : g.top; if (w) w.x = clamp(loser.x - 26*loser.dir, LEFT, RIGHT); loser.state = 'ko'; G.gr = null; hideMash(); }
  G.mode = 'result'; G.t = 0; G.resShown = false;
  const l = w === p ? o : w === o ? p : null;
  const elapsed = clockStr(ROUND_T - G.time);
  if (w){ w.state = 'win'; w.t = 0; w.atk = null; }
  if (l) l.state = method === 'DEC' ? 'lose' : 'ko';
  if (!w){ p.state = 'lose'; o.state = 'lose'; }
  const won = w === p, B = G.bout;
  const at = `at ${elapsed} of round ${G.round}`, on = said(B.oF);

    SFX.swell(.6);

    else if (method === 'SUB') msg = `you tapped to ${/^[aeiou]/.test(x.name) ? 'an' : 'a'} ${x.name} and ${tail}`;
    else if (method === 'TKO') msg = `you got stuck on your back eating punches and ${tail}`;
    else if (p.gassedKO || p.gassedCount >= 2) msg = `you gassed out too fast and ${tail}`;
    else if (p.lastHow === 'super') msg = `you ate a flying knee and ${tail}`;
    else if (p.lastHow === 'head') msg = `you walked right into a head kick and ${tail}`;
    else if (p.duckedUpper) msg = `you ducked right into the uppercut and ${tail}`;
    else msg = `you got caught with your hands down and ${tail}`;
  }
  const verb = isTouch ? 'tap' : 'press spacebar';
  G.res = {won, msg, prompt: won ? `${verb} to pick your next fight` : `${verb} for a rematch`};
  SFX.bell(won ? 3 : 2);
  if (method === 'DEC') showBig(w ? (won ? 'YOU WIN' : 'DECISION') : 'DRAW', 1.1);
  else if (method === 'SUB') showBig('TAP OUT!', 1.4);
  else if (method === 'TKO') showBig('TKO!', 1.4);
}

function spark(x, y, big, blocked){
  const n = blocked ? 4 : big ? 10 : 6;
  for (let i = 0; i < n; i++){
    const a = rnd()*Math.PI*2, s = 30 + rnd()*70;
    PARTS.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, g:0, life:.12 + rnd()*.18, c:blocked ? '#cfd6e6' : pick(['#ffffff','#ffe680','#f3c623'])});

}
function blood(x, y, dir){ for (let i = 0; i < 3; i++) PARTS.push({x, y, vx:dir*(20 + rnd()*40), vy:-30 - rnd()*40, g:240, life:.5, c:'#b3161c'}); }
function sweat(f){ PARTS.push({x:f.x + f.dir*3, y:FLOOR - 52, vx:(rnd()-.5)*30 - f.dir*15, vy:-25 - rnd()*25, g:180, life:.55, c:'#cfe8ff'}); }

function updFx(dt){
  for (let i = PARTS.length - 1; i >= 0; i--){ const q = PARTS[i]; q.life -= dt; q.x += q.vx*dt; q.y += q.vy*dt; q.vy += q.g*dt; if (q.life <= 0 || q.y > FLOOR + 4 && q.g) PARTS.splice(i, 1); }
  for (let i = POPS.length - 1; i >= 0; i--){ const q = POPS[i]; q.life -= dt; q.y -= 14*dt; if (q.life <= 0) POPS.splice(i, 1); }
  for (let i = FLASHES.length - 1; i >= 0; i--){ FLASHES[i].life -= dt; if (FLASHES[i].life <= 0) FLASHES.splice(i, 1); }
  const lo = Math.max(CAMY + 2, -150);
  if (lo < 76 && rnd() < dt*(2 + G.hype*14)*VW/W) FLASHES.push({x:CAMX + rnd()*VW | 0, y:lo + rnd()*(76 - lo) | 0, life:.06});

/* ---------- update ---------- */
function update(dt){
  G.t += dt;
  switch (G.mode){
    case 'title': case 'between':
      stepFighter(p, dt, o, null); stepFighter(o, dt, p, null);
      if (G.mode === 'title' && SEL.step === 'vs' && SEL.vsT > 0){ SEL.vsT -= dt/spd(); if (SEL.vsT <= 0) startFight(); }
      break;
    case 'intro': {
      stepFighter(p, dt, o, {move:p.x < 70 ? 1 : 0}); stepFighter(o, dt, p, {move:o.x > 122 ? -1 : 0});
      if (G.t >= 1.1 && !G.said){ G.said = true; showBig('FIGHT!', .8); SFX.bell(1); SFX.swell(.35); }
      if (G.t >= 1.6){ G.mode = 'fight'; IN.q.length = 0; }
      break;
    }
    case 'fight': {
      const pc = playerCtrl(), oc = brain(o, p, dt);
      stepFighter(p, dt, o, pc);
      if (G.mode !== 'fight') break;
      stepFighter(o, dt, p, oc);
      if (G.mode !== 'fight') break;
      separate();
      const before = G.time; G.time -= dt/spd();
      if (before > 10 && G.time <= 10) SFX.clap();
      if (G.time <= 0){ G.time = 0; endRound(); }
      break;
    }
    case 'ground': updGround(dt); break;
    case 'pounce': {
      const {v, a} = G.ev, gap = Math.abs(v.x - a.x);
      stepFighter(v, dt, a, null);
      stepFighter(a, dt, v, {move:gap > 16 ? Math.sign(v.x - a.x) : 0});
      if (G.t >= .6) takedown(a, v, true);
      break;
    }
    case 'koSeq': {

  drawBody(Math.round(REF.x), oy, REF.dir, LOOK_REF, scaleQ(q, .98), null);
}
function drawFighter(f){
  const lying = f.state === 'down' || f.state === 'ko' || f.state === 'gbot' || (f.state === 'up' && f.t < .35);
  shadow(f.x - (lying ? f.dir*4 : 0), FLOOR, lying ? 40 : 22);
  drawBody(Math.round(f.x), FLOOR, f.dir, f.look, scaleQ(poseOf(f), f.sc), f);
}
function hbar(x, y, w, h, fr, trail, flip){
  const fw = Math.round(w*clamp(fr, 0, 1)), tw2 = Math.round(w*clamp(trail, 0, 1));
  ctx.fillStyle = '#000'; ctx.fillRect(x-1, y-1, w+2, h+2);
  ctx.fillStyle = '#3a1014'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(flip ? x + w - tw2 : x, y, tw2, h);
  ctx.fillStyle = fr > .3 ? '#f3c623' : '#e2382b'; ctx.fillRect(flip ? x + w - fw : x, y, fw, h);
  ctx.fillStyle = fr > .3 ? '#fff1a8' : '#ff8a7a'; ctx.fillRect(flip ? x + w - fw : x, y, fw, 1);
}
function sbar(x, y, w, f, flip){
  const fr = f.st/100, fw = Math.round(w*clamp(fr, 0, 1)), cap = Math.round(w*f.stMax/100);
  ctx.fillStyle = '#000'; ctx.fillRect(x-1, y-1, w+2, 4);
  ctx.fillStyle = '#0f2418'; ctx.fillRect(flip ? x + w - cap : x, y, cap, 2);
  let c = fr > .4 ? '#4fd37a' : fr > .2 ? '#f39c23' : '#e2382b';
  if (f.state === 'gassed' && Math.floor(G.clock*8) % 2) c = '#ffffff';
  ctx.fillStyle = c; ctx.fillRect(flip ? x + w - fw : x, y, fw, 2);
}
function spbar(x, y, w, f, flip){
  const fw = Math.round(w*clamp(f.sp/100, 0, 1)), full = f.sp >= 100;
  ctx.fillStyle = '#000'; ctx.fillRect(x-1, y-1, w+2, 4);
  ctx.fillStyle = '#2a2208'; ctx.fillRect(x, y, w, 2);
  ctx.fillStyle = full ? (Math.floor(G.clock*8) % 2 ? '#ffffff' : '#f3c623') : '#c9921a';
  ctx.fillRect(flip ? x + w - fw : x, y, fw, 2);
}
function drawHUD(){
  if (G.mode === 'title') return;
  // pinned to the top corners of the free view, leaving the middle for the pause button
  const L = Math.round(VIEW.x) + 4, R = Math.round(VIEW.x + VIEW.w) - 4, T = Math.round(VIEW.y) + 4;
  const bw = Math.min(78, Math.floor(VIEW.w/2) - 14), sw = Math.round(bw*.72);
  hbar(L, T, bw, 5, p.hp/p.hpMax, p.hpShown/p.hpMax, false);
  hbar(R - bw, T, bw, 5, o.hp/o.hpMax, o.hpShown/o.hpMax, true);
  sbar(L, T + 7, sw, p, false); sbar(R - sw, T + 7, sw, o, true);
  spbar(L, T + 11, sw, p, false); spbar(R - sw, T + 11, sw, o, true);
  if (p.combo >= 2 && p.comboT > 0) txtOut(ctx, p.combo + ' HITS', L, T + 22, '#f3c623');
  if (o.combo >= 2 && o.comboT > 0) txtOut(ctx, o.combo + ' HITS', R - tw(o.combo + ' HITS'), T + 22, '#f3c623');
  ctx.fillStyle = '#e2382b';
  for (let i = 0; i < p.downs; i++) ctx.fillRect(L + sw + 2 + i*4, T + 7, 3, 2);
  for (let i = 0; i < o.downs; i++) ctx.fillRect(R - sw - 5 - i*4, T + 7, 3, 2);
  if (p.state === 'gassed') txtOut(ctx, 'GASSED', L, T + 15, '#f39c23');
  if (o.state === 'gassed') txtOut(ctx, 'GASSED', R - tw('GASSED'), T + 15, '#f39c23');
}
function render(){
  if (CAM.hi > CAM.lo && p && o){
    const tgt = clamp((p.x + o.x)/2 - (VIEW.x + VIEW.w/2), CAM.lo, CAM.hi);
    CAM.f += (tgt - CAM.f)*.08; CAMX = Math.round(CAM.f);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, VH);
  let sx = 0, sy = 0;
  if (G.shake > 0 && !reduceMotion){ const m = Math.min(1, G.shake*4); sx = Math.round((rnd()-.5)*4*m); sy = Math.round((rnd()-.5)*3*m); }
  ctx.save(); ctx.translate(sx - CAMX, sy - CAMY);
  const hop = G.hype > .35 && Math.floor(G.clock*10) % 2 === 0 ? -1 : 0;
  ctx.drawImage(CROWD, CAM.lo, CAMY + hop);
  ctx.fillStyle = '#ffffff';
  for (const fl of FLASHES){ ctx.fillRect(fl.x, fl.y, 1, 1); ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(fl.x-1, fl.y, 3, 1); ctx.fillRect(fl.x, fl.y-1, 1, 3); ctx.fillStyle = '#ffffff'; }
  ctx.drawImage(ARENA, CAM.lo, CAMY);
  drawRef();
  if (G.gr){ drawFighter(G.gr.bot); drawFighter(G.gr.top); }
  else if (p.state === 'atk' && o.state !== 'atk'){ drawFighter(o); drawFighter(p); }
  else { drawFighter(p); drawFighter(o); }
  for (const q of PARTS){
    ctx.fillStyle = q.c;
    if (q.star){ const s = q.star; ctx.fillRect(Math.round(q.x - s), Math.round(q.y), s*2 + 1, 1); ctx.fillRect(Math.round(q.x), Math.round(q.y - s), 1, s*2 + 1); }
    else ctx.fillRect(Math.round(q.x), Math.round(q.y), 1, 1);
  }
  for (const q of POPS) txtOut(ctx, q.s, Math.round(q.x - tw(q.s)/2), Math.round(q.y), q.c);
  ctx.restore();
  drawHUD();
  if (G.flash > 0){ ctx.fillStyle = `rgba(255,255,255,${Math.min(.8, G.flash)})`; ctx.fillRect(0, 0, VW, VH); }
}
// Fit the camera to the space the pads leave free. The fight area (x 12-180, y 24-144) always fits;
// whatever is left over shows more crowd, cage and mat.
const appEl = $('app'), worldEl = $('world');
function layout(){
  const vw = stageEl.clientWidth, vh = stageEl.clientHeight;
  if (!vw || !vh || !window.getComputedStyle) return;
  const mode = getComputedStyle(appEl).getPropertyValue('--mode').trim() || 'portrait';
  const v = {x:0, y:0, w:vw, h:vh};
  const pl = document.querySelector('.pad.left').getBoundingClientRect(), pr = document.querySelector('.pad.right').getBoundingClientRect();
  if (mode === 'desktop') v.h = Math.max(120, document.querySelector('.legend').getBoundingClientRect().top - 4);
  else if (mode === 'landscape'){ v.x = pl.right + 6; v.w = Math.max(120, pr.left - 6 - v.x); }
  else v.h = Math.max(120, Math.min(pl.top, pr.top) - 10);
  // portrait is narrow, so it zooms in closer and the camera follows the action
  const s = Math.min(v.w/(mode === 'portrait' ? 148 : 168), v.h/120);
  VW = Math.ceil(vw/s); VH = Math.ceil(vh/s);
  const mid = (v.x + v.w/2)/s;
  CAM.lo = Math.round(8 - v.x/s); CAM.hi = Math.round(184 - (v.x + v.w)/s);
  if (CAM.lo >= CAM.hi) CAM.lo = CAM.hi = Math.round(96 - mid);
  CAMX = CAM.lo; CAM.f = clamp(96 - mid, CAM.lo, CAM.hi);
  // portrait has height to spare: keep the fight just above the thumbs and let the crowd fill the top
  CAMY = Math.round(mode === 'portrait' ? 146 - (v.y + v.h)/s : 84 - (v.y + v.h/2)/s);
  VIEW = {x:v.x/s, y:v.y/s, w:v.w/s, h:v.h/s};
  cv.width = VW; cv.height = VH; ctx.imageSmoothingEnabled = false;
  CROWD = buildCrowd(CAM.lo, VW + CAM.hi - CAM.lo); ARENA = buildArena(CAM.lo, VW + CAM.hi - CAM.lo);
  CAMX = Math.round(CAM.f);
  Object.assign(worldEl.style, {left:v.x + 'px', top:v.y + 'px', width:v.w + 'px', height:v.h + 'px'});
  worldEl.style.setProperty('--u', Math.min(v.w, 960)/100 + 'px');
}
let layoutQ = 0;
const relayout = () => { if (!layoutQ) layoutQ = requestAnimationFrame(() => { layoutQ = 0; layout(); render(); }); };
window.addEventListener('resize', relayout);
window.addEventListener('orientationchange', relayout);
if (window.visualViewport) visualViewport.addEventListener('resize', relayout);
let lastClock = '', lastRd = '';
function updDom(){
  const c = clockStr(G.time), r = 'R' + G.round;
  if (c !== lastClock){ $('bugClock').textContent = c; lastClock = c; }
  if (r !== lastRd){ $('bugRd').textContent = r; lastRd = r; }
  refreshLabels();
}

/* ---------- input ---------- */
function press(a){
  initAudio();
  if (G.paused) return;
  if (G.mode === 'fight'){ if (IN.q.length < 2) IN.q.push(a); return; }
  if (G.mode === 'ground'){ if (IN.q.length < 6) IN.q.push(a); return; }
  if (G.mode === 'result' || G.mode === 'between') cont();
}
const subActive = () => G.mode === 'ground' && G.gr && G.gr.sub;
document.querySelectorAll('.k').forEach(btn => {
  const k = btn.dataset.k, hold = !!btn.dataset.hold;
  const down = e => {
    e.preventDefault(); initAudio();
    try { btn.setPointerCapture(e.pointerId); } catch (err) {}
    btn.classList.add('on');
    if (hold){ IN[k] = true; if (subActive()) press('mash'); }
    else press(k);
  };
  const up = () => { btn.classList.remove('on'); if (hold) IN[k] = false; };
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('lostpointercapture', up);
  btn.addEventListener('contextmenu', e => e.preventDefault());
});
stageEl.addEventListener('pointerdown', e => {
  if (e.target.closest('#pauseBtn')) return;
  e.preventDefault(); initAudio();
  if (G.mode === 'ground'){ if (G.gr.sub) press('mash'); else if (G.gr.bot === p) press('shoot'); }
  else cont();
});
$('pauseBtn').addEventListener('click', e => { e.stopPropagation(); initAudio(); if (G.paused) resume(); else showPause(); });
const KEYMAP = {a:'left', arrowleft:'left', d:'right', arrowright:'right', s:'block', arrowdown:'block'};
const TAPMAP = {j:'jab', z:'jab', k:'cross', x:'cross', l:'hook', c:'hook', i:'upper', v:'upper', u:'leg', o:'head', e:'shoot', q:'shoot', w:'slip', arrowup:'slip', shift:'slip'};
// Keys go by their place on the keyboard, not the letter they type, so J still jabs on a Hebrew or AZERTY layout.
const keyOf = e => {
  const c = e.code || '';
  if (/^Key[A-Z]$/.test(c)) return c.slice(3).toLowerCase();
  if (c.startsWith('Shift')) return 'shift';
  if (c === 'Space') return ' ';
  if (c === 'NumpadEnter') return 'enter';
  return (e.key || '').toLowerCase();
};
document.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  const k = keyOf(e);
  if ([' ', 'arrowleft', 'arrowright', 'arrowup', 'arrowdown'].includes(k)) e.preventDefault();
  initAudio();
  if (k === 'p' || k === 'escape'){ if (G.paused) resume(); else showPause(); return; }
  if (G.paused){ if (k === ' ' || k === 'enter') resume(); return; }
  if (!e.repeat && selKey(k)){ e.preventDefault(); return; }
  if (KEYMAP[k]){ IN[KEYMAP[k]] = true; if (!e.repeat && subActive()) press('mash'); return; }
  if (e.repeat) return;
  if (TAPMAP[k]){ press(TAPMAP[k]); return; }
  if (k === ' ' || k === 'enter'){
    if (G.mode === 'title'){ const b = $('fightBtn') || $('pickOk') || $('pickBtn'); if (b) b.click(); }
    else if (G.mode === 'ground') press(G.gr.sub ? 'mash' : 'shoot');
    else cont();
  }
});
document.addEventListener('keyup', e => { const k = KEYMAP[keyOf(e)]; if (k) IN[k] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) showPause(); });
window.addEventListener('blur', () => { IN.left = IN.right = IN.block = false; if (!isTouch) showPause(); });
document.addEventListener('pointerdown', () => { try { window.focus(); } catch (e) {} }, true);

/* ---------- loop ---------- */
let last = performance.now();
function loop(now){
  let dt = Math.min(.05, (now - last)/1000); last = now;
  G.clock += dt;
  if (!G.paused){
    if (G.slow > 0){ G.slow -= dt; dt *= .35; }
    if (G.hitstop > 0) G.hitstop -= dt; else update(dt*spd());
    updFx(dt*spd());
  }
  render(); updDom();
  requestAnimationFrame(loop);
}
layout();
showTitle();
requestAnimationFrame(loop);
})();
</script>
